name: Appium E2E Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Backend Dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install fastapi uvicorn email-validator pandas openpyxl

    - name: Start FastAPI Backend
      working-directory: ./backend
      run: |
        # Use 0.0.0.0 so the Android emulator can reach it via 10.0.2.2
        uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        npx -y wait-on tcp:8000 -t 30000

    - name: Install Mobile Dependencies
      working-directory: ./mobile
      run: npm install

    - name: Prebuild Android App
      working-directory: ./mobile
      run: |
        npx expo prebuild --platform android --clean
        cd android
        ./gradlew assembleDebug

    - name: Install E2E Dependencies
      working-directory: ./mobile-e2e-tests
      run: |
        npm install
        npm install -g appium
        appium driver install uiautomator2

    - name: Start Appium Server
      run: appium -a 127.0.0.1 -p 4723 &
      
    - name: Run Appium Tests in Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        target: google_apis
        arch: x86_64
        profile: pixel_6
        script: |
          cd mobile-e2e-tests
          npx wdio run wdio.conf.js
