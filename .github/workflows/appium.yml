name: Appium E2E Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4
    
    - name: Enable KVM for Android Emulator
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Backend Dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install fastapi uvicorn email-validator pandas openpyxl

    - name: Start FastAPI Backend
      working-directory: ./backend
      run: |
        uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        npx -y wait-on tcp:8000 -t 30000

    - name: Install Mobile Dependencies
      working-directory: ./mobile
      run: npm install

    - name: Prebuild Android App
      working-directory: ./mobile
      run: |
        npx expo prebuild --platform android --clean
        cd android
        ./gradlew assembleDebug

    - name: Install E2E Dependencies
      working-directory: ./appium-tests
      run: npm install

    - name: Install Appium and UiAutomator2
      run: |
        npm install -g appium
        appium driver install uiautomator2
        appium --version
        appium driver list --installed

    - name: Create Test Script
      run: |
        cat << 'EOF' > run_appium_tests.sh
        #!/bin/bash
        echo "Waiting for adb wait-for-device..."
        adb wait-for-device
        
        echo "Waiting for sys.boot_completed..."
        BOOT_COMPLETED=""
        for i in $(seq 1 120); do
            BOOT_COMPLETED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            echo "Boot check $i/120: $BOOT_COMPLETED"
            if [ "$BOOT_COMPLETED" = "1" ]; then
                echo "Android boot completed."
                break
            fi
            sleep 5
        done
        
        if [ "$BOOT_COMPLETED" != "1" ]; then
            echo "Emulator failed to boot in time."
            adb devices -l
            adb logcat -d -t 500 || true
            exit 1
        fi
        
        echo "Waiting for package manager..."
        for i in $(seq 1 60); do
            if adb shell pm path android >/dev/null 2>&1; then
                echo "Package manager is ready."
                break
            fi
            sleep 2
        done
        
        echo "Disabling animations..."
        adb shell settings put global window_animation_scale 0
        adb shell settings put global transition_animation_scale 0
        adb shell settings put global animator_duration_scale 0
        
        echo "Verifying emulator connection..."
        adb devices
        
        echo "Starting Appium server..."
        appium --address 127.0.0.1 --port 4723 --base-path /wd/hub > appium.log 2>&1 &
        
        echo "Waiting for Appium to start..."
        for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4723/wd/hub/status > /dev/null; then
                echo "Appium server is ready."
                break
            fi
            if [ $i -eq 30 ]; then
                echo "Appium failed to start."
                cat appium.log
                exit 1
            fi
            sleep 2
        done
        
        echo "Running Appium tests..."
        cd appium-tests
        npx wdio run wdio.conf.js
        EOF
        chmod +x run_appium_tests.sh

    - name: Run Appium Tests in Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: default
        arch: x86_64
        profile: pixel_2
        cores: 2
        ram-size: 4096M
        heap-size: 512M
        disk-size: 8G
        force-avd-creation: true
        disable-animations: true
        emulator-boot-timeout: 1200
        emulator-options: >
          -no-window
          -no-audio
          -no-boot-anim
          -no-snapshot
          -gpu swiftshader_indirect
        script: ./run_appium_tests.sh

    - name: Upload Debug Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-artifacts
        path: |
          appium.log
          appium-tests/reports/
          appium-tests/test-results/
          appium-tests/screenshots/
          appium-tests/videos/
          appium-tests/logs/
        if-no-files-found: ignore
