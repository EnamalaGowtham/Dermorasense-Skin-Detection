name: Selenium E2E Tests

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.xlsx'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Backend Dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install fastapi uvicorn selenium webdriver-manager pandas openpyxl

    - name: Start FastAPI Backend
      working-directory: ./backend
      run: |
        uvicorn main:app --host 0.0.0.0 --port 8000 &
        npx -y wait-on tcp:8000 -t 30000

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install

    - name: Start Vite Frontend
      working-directory: ./frontend
      run: |
        npm run dev -- --port 5173 --host &
        npx -y wait-on tcp:5173 -t 30000

    - name: Run Selenium Tests
      run: python selenium_test.py

    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Selenium-Test-Reports
        path: |
          test-report/*.xlsx
          test-report/screenshots/

    - name: Commit and Push Report
      if: always()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add test-report/*.xlsx || true
        if [[ -n "$(git status --short)" ]]; then
          git commit -m "chore: update automated test report [skip ci]"
          git push
        else
          echo "No report changes to commit."
        fi
