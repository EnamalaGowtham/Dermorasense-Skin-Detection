name: Performance & Load Testing Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-load-test:
    name: Backend API Load Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install requests
          
      - name: Start FastAPI Backend Background Process
        run: |
          cd backend
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          # Give it a few seconds to fully boot
          sleep 5
          
      - name: Execute High Concurrency Load Test
        run: |
          python scripts/run_load_test.py
